## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime.

dist-ai-tests:
  ## fixes_test.sh drives the real 'fixes' pipeline: sponge (moreutils) for the
  ## qterminal config rewrite; str_replace + safe-rm come from the helper-scripts
  ## checkout + baseline. sudo / locale-gen / qubesdb-read are mocked in-test.
  apt-packages: "moreutils"
  ## legacy-dist sources helper-scripts' origins-parser, log_run_die.sh, has.bsh,
  ## shim-signed-mok-setup and package_installed_check.sh/.bsh by the
  ## '${HELPER_SCRIPTS_PATH:-}' path with a relative '# shellcheck source='
  ## directive. Provide helper-scripts as the repo sibling so the
  ## pre-push-static gate's shellcheck FOLLOWS the source instead of emitting
  ## SC1091 -- no per-line '# shellcheck disable=SC1091'.
  helper-scripts: true
